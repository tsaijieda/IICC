# 戰術語言依 1st_half_rules.md（傳球點評分）
play_id: "T003"
title: "題型 3：大範圍撕裂與倒三角"
description: "中場（CM）在右路中路接球。中場強弱邊轉移給左邊鋒（LW），左邊鋒在左路底線接球。左邊鋒倒三角傳球給前鋒（ST），前鋒在弧頂前緣接球。前鋒盤帶推進至禁區中央得分。"
