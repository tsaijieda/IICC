# 戰術語言依 1st_half_rules.md（傳球點評分）
play_id: "A002"
title: "題型 A002：大範圍撕裂與倒三角"
description: "中場（CM）在右路中路接球。中場強弱邊轉移給左邊鋒（LW），左邊鋒在左路底線接球。左邊鋒倒三角傳球給前鋒（ST），前鋒在弧頂前緣接球。前鋒傳球給跑進禁區的左邊鋒（LW），左邊鋒在禁區中央得分。"
scoring_mode: pass_points

evaluation_points:
  強弱邊轉移: "傳球人：中場（CM）→ 左邊鋒（LW）；邊：強弱邊轉移；接球點：左路底線。"
  倒三角傳球: "傳球人：左邊鋒（LW）→ 前鋒（ST）；邊：倒三角傳球；接球點：弧頂前緣。"
  傳球: "傳球人：前鋒（ST）→ 左邊鋒（LW）；邊：傳球；接球點：禁區中央；得分。"

pass_points:
  - {zone: 16, place: 右路中路, receiver: CM}
  - {zone: 18, place: 左路底線, passer: CM, receiver: LW, pass_action: 強弱邊轉移}
  - {zone: 14, place: 弧頂前緣, passer: LW, receiver: ST, pass_action: 倒三角傳球}
  - {zone: 20, place: 禁區中央, passer: ST, receiver: LW, pass_action: 傳球, outcome: 得分}

run_tactic:
  reception_radius_m: 1.0
  score_touches:
    - {touch: 0, zone: 16, receiver: CM, label: "評分①"}
    - {touch: 1, zone: 18, receiver: LW, label: "評分②"}
    - {touch: 2, zone: 14, receiver: ST, label: "評分③"}
    - {touch: 3, zone: 20, receiver: LW, label: "評分④"}
  defenders:
    - {zone: 7, note: "擋中路短換邊"}
    - {between: [18, 14], note: "擋底線貼線倒三角"}

y_label: "Field Depth (m)"
x_label: "Time (seconds)"
x_limits: [0.0, 5.2]
y_limits: [50, 110]

