  強弱邊轉移: "傳球人：中後衛（CB）→ 左邊鋒（LW）；邊：強弱邊轉移；接球點：左路底線。"
  盤帶推進: "接球人：左邊鋒（LW）；邊：盤帶推進；左路底線 → 禁區中央；得分。"

