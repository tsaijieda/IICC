play_id: "T011"
title: "題型 11：後場脫困長轉移"
description: "後腰（DM）在後場中路接球。後腰傳球給中後衛（CB），中後衛在後場中路接球。中後衛強弱邊轉移給左邊鋒（LW），左邊鋒在左路底線接球。左邊鋒傳中給前鋒（ST），前鋒在禁區中央得分。"
scoring_mode: pass_points

evaluation_points:
  傳球: "傳球人：後腰（DM）→ 中後衛（CB）；邊：傳球；接球點：後場中路。"
  強弱邊轉移: "傳球人：中後衛（CB）→ 左邊鋒（LW）；邊：強弱邊轉移；接球點：左路底線。"
  傳中: "傳球人：左邊鋒（LW）→ 前鋒（ST）；邊：傳中；接球點：禁區中央；得分。"

pass_points:
  - {zone: 7, place: 後場中路, receiver: DM}
  - {zone: 7, place: 後場中路, passer: DM, receiver: CB, pass_action: 傳球}
  - {zone: 18, place: 左路底線, passer: CB, receiver: LW, pass_action: 強弱邊轉移}
  - {zone: 20, place: 禁區中央, passer: LW, receiver: ST, pass_action: 傳中, outcome: 得分}

run_tactic:
  reception_radius_m: 1.0
  score_touches:
    - {touch: 0, zone: 7, receiver: DM, label: "評分①"}
    - {touch: 1, zone: 7, receiver: CB, label: "評分②"}
    - {touch: 2, zone: 18, receiver: LW, label: "評分③"}
    - {touch: 3, zone: 20, receiver: ST, label: "評分④"}
  defenders:
    - {zone: 16, note: "擋中路短換邊"}
    - {between: [18, 20], note: "擋底線貼線傳中"}

y_label: "Field Depth (m)"
