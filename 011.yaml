title: "題型 11：後場脫困長轉移"
description: "後腰（DM）在後場中路接球。後腰傳球給中後衛（CB），中後衛在後場中路接球。中後衛強弱邊轉移給左邊鋒（LW），左邊鋒在左路底線接球。左邊鋒盤帶推進至禁區中央得分。"
