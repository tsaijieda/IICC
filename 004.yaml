# 基本資訊與敘述
play_id: "T004"
title: "題型 4：中路三人過度"
description: "後腰將球直塞給前鋒。前鋒第一時間執行回做球給前腰。前腰迎球再次發動直塞給跑位的另一名前鋒，該前鋒射正。"

# 評分檢核點
evaluation_points:
  直塞 (首次): "球是否從 zone 8 向前穿越防線至 zone 14/20？"
  回做球: "前鋒是否在 zone 14/20 背對球門，一腳觸球傳回給 zone 11/13/15 的前腰？"
  直塞 (二次): "前腰是否成功將球穿越最後一道防線？"

# 畫布與座標設定
y_label: "Field Depth (m)"
x_label: "Time (seconds)"
x_limits: [0.0, 5.0]
y_limits: [30, 110]

# 實體時空軌跡 (x-t data)
entities:
  - id: "DM"
    label: "Def. Mid (DM)"
    color: "#B48EAD"  # 紫色
    linestyle: "-"
    trajectory:
      - [0.0, 40]     # 後腰在深處持球 (Zone 8 邊緣)
      - [1.0, 40]     # 抓準時機送出直塞
      - [5.0, 45]     # 傳球後稍微向前推進保護陣型

  - id: "ST1"
    label: "Target Striker (ST1)"
    color: "#4A85F6"  # 藍色
    linestyle: "-"
    trajectory:
      - [0.0, 85]     # 支點前鋒在高位 (Zone 14/20 交界) 背身要球
      - [2.0, 85]     # 迎球第一時間觸球
      - [5.0, 85]     # 完成回做球後，留在原地牽制中後衛

  - id: "AM"
    label: "Attacking Mid (AM)"
    color: "#74DB7A"  # 綠色
    linestyle: "-"
    trajectory:
      - [0.0, 65]     # 前腰在中路 (Zone 11/14 之間)
      - [2.0, 70]     # 向前迎球準備接應
      - [2.5, 70]     # 停下回做球，瞬間送出致命直塞
      - [5.0, 75]     # 跟進觀察

  - id: "ST2"
    label: "Running Striker (ST2)"
    color: "#F6B746"  # 黃色
    linestyle: "-"
    trajectory:
      - [0.0, 75]     # 另一名前鋒埋伏在防線前
      - [2.0, 75]     # 看到 ST1 回做球，立刻啟動前插
      - [3.5, 95]     # 打穿防線，在禁區深處接獲 AM 的直塞
      - [4.5, 95]     # 完成射門動作

  - id: "Ball"
    label: "Ball"
    color: "#F26974"  # 亮紅色
    linestyle: "-"
    trajectory:
      - [0.0, 40]     # 球在後腰腳下
      - [1.0, 40]     # 發動第一次長距離直塞 (Up)
      - [2.0, 85]     # ST1 觸球
      - [2.5, 70]     # 一腳觸球回做！(Back：軌跡出現負斜率往回折)
      - [3.5, 95]     # AM 再次直塞，精準送到前插的 ST2 腳下 (Through)
      - [4.0, 105]    # ST2 射門，球飛入球門

  - id: "Offside"
    label: "Offside Line"
    color: "#EAC2CE"  # 粉白色
    linestyle: "--"
    trajectory:
      - [0.0, 88]     # 防線位置
      - [2.5, 88]     # 保持不變，AM 傳球瞬間，ST2 (x=75) 在線後，完全沒越位
      - [3.5, 92]     # 發現被打穿，防守者轉身回追
      - [5.0, 95]
