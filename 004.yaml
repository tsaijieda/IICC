play_id: "T004"
title: "題型 4：中路三人過度"
description: "後腰（DM）在後場中路接球。後腰直塞給前鋒（ST1），前鋒在弧頂前緣接球。前鋒回做球給前腰（AM），前腰在左肋深處接球。前腰直塞給前鋒（ST2），前鋒在禁區中央射正。"
