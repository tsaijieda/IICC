  回做球: "傳球人：前鋒（ST1）→ 前腰（AM）；邊：回做球；接球點：左肋深處。"
  直塞 (終點): "傳球人：前腰（AM）→ 前鋒（ST2）；邊：直塞；接球點：禁區中央；射正。"

