play_id: "T006"
title: "題型 6：高空作業與做牆"
description: "中後衛（CB）在後場中路發動過頂長傳，前鋒（ST）在弧頂前緣接球。前鋒回做球給前腰（AM），前腰在左肋深處接球。前腰傳球給前鋒（ST），前鋒在禁區中央得分。"
scoring_mode: pass_points

evaluation_points:
  過頂長傳: "傳球人：中後衛（CB）→ 前鋒（ST）；邊：過頂長傳；接球點：弧頂前緣。"
  回做球: "傳球人：前鋒（ST）→ 前腰（AM）；邊：回做球；接球點：左肋深處。"
  傳球: "傳球人：前腰（AM）→ 前鋒（ST）；邊：傳球；接球點：禁區中央；得分。"

pass_points:
