# 基本資訊與敘述
play_id: "T006"
title: "題型 6：高空作業與做牆"
description: "後衛發動過頂長傳給前鋒。前鋒接球後，與旁邊的前腰執行撞牆配合突破最後一道圓柱，前鋒接獲回傳後得分。"

# 評分檢核點
evaluation_points:
  過頂長傳: "球的飛行軌跡是否越過防線圓柱體頂部，落在防線後方？"
  撞牆配合: "前鋒傳給前腰後，是否立刻向前跑？前腰是否「一腳出球」精準傳回給前鋒？"

# 畫布與座標設定
y_label: "Field Depth (m)"
x_label: "Time (seconds)"
x_limits: [0.0, 6.0]
y_limits: [20, 110]

# 實體時空軌跡 (x-t data)
entities:
  - id: "CB"
    label: "Center Back (CB)"
    color: "#B48EAD"  # 紫色
    linestyle: "-"
    trajectory:
      - [0.0, 25]     # 後衛在後場拿球
      - [1.0, 25]     # 發動長傳
      - [6.0, 35]     # 傳球後陣型稍微推進

  - id: "ST"
    label: "Striker (ST)"
    color: "#4A85F6"  # 藍色
    linestyle: "-"
    trajectory:
      - [0.0, 75]     # 前鋒在越位線前沿待命
      - [1.0, 75]     # 看見後衛起腳，立刻轉身前插
      - [3.0, 85]     # 跑在防線後方，成功卸下過頂長傳
      - [3.5, 85]     # 稍作停頓，傳給前腰
      - [4.5, 95]     # 傳球後「立刻」繼續爆發衝刺，打穿防守圓柱
      - [5.5, 95]     # 射門得分後減速

  - id: "AM"
    label: "Attacking Mid (AM)"
    color: "#74DB7A"  # 綠色
    linestyle: "-"
    trajectory:
      - [0.0, 65]     # 前腰在稍後方的位置
      - [3.0, 80]     # 快速跟進，來到 ST 後方準備接應
      - [4.0, 80]     # t=4.0 迎球直接「一腳觸球」做牆
      - [6.0, 80]     # 原地目送前鋒單刀

  - id: "Ball"
    label: "Ball"
    color: "#F26974"  # 亮紅色
    linestyle: "-"
    trajectory:
      - [0.0, 25]     # 球在後場
      - [1.0, 25]     # 長傳出球！
      - [3.0, 85]     # 跨越 60 公尺，落入前鋒腳下
      - [3.5, 85]     # 前鋒傳給前腰
      - [4.0, 80]     # 球稍微往回滾到前腰腳下
      - [4.5, 95]     # 前腰一腳觸球做牆！球塞向前鋒跑動的軌跡
      - [5.0, 105]    # 前鋒起腳，球飛入球門

  - id: "Offside"
    label: "Offside Line"
    color: "#EAC2CE"  # 粉白色
    linestyle: "--"
    trajectory:
      - [0.0, 80]     # 防線原先壓在 80m
      - [1.0, 80]     # 長傳瞬間，ST(x=75) 未越位
      - [3.0, 80]     # 發現球飛過頭頂，防線來不及後撤
      - [4.5, 88]     # 被迫狼狽轉身回追，但已被撞牆配合徹底打穿
      - [6.0, 95]
