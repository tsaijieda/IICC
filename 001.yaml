# 基本資訊與敘述
play_id: "T001"
title: "題型 1：邊路經典爆破"
description: "右前腰在肋部持球，右邊後衛執行套邊插上。前腰將球傳球給邊後衛後，邊後衛立刻下底發動傳中，前鋒在禁區內得分。"

# 評分檢核點 (以字典格式儲存，方便程式一條一條讀取)
evaluation_points:
  套邊插上: "外側球員是否確實從 zone 17 跑到 19？傳球是否在 zone 15 傳向 19？"
  傳中: "球是否由 zone 19 傳入 zone 20？"
  得分: "球是否進入球框特定範圍？"

y_label: "Field Depth (m)"
x_label: "Time (seconds)"
x_limits: [0.0, 4.2]
y_limits: [50, 100]

entities:
  - id: "ST"
    label: "Striker (ST)"
    color: "#4A85F6"  # 藍色
    linestyle: "-"
    trajectory:
      - [0.0, 80]
      - [2.0, 80]
      - [4.0, 95]

  - id: "AM"
    label: "Attacker (AM)"
    color: "#74DB7A"  # 綠色
    linestyle: "-"
    trajectory:
      - [0.0, 70]
      - [2.0, 70]
      - [4.0, 80]

  - id: "FB"
    label: "Fullback (FB)"
    color: "#F6B746"  # 黃色
    linestyle: "-"
    trajectory:
      - [0.0, 50]
      - [2.0, 80]
      - [3.0, 95]
      - [4.0, 95]

  - id: "Ball"
    label: "Ball"
    color: "#F26974"  # 亮紅色
    linestyle: "-"
    trajectory:
      - [0.0, 70]
      - [2.0, 70]
      - [3.0, 95]
      - [4.0, 95]

  - id: "Offside"
    label: "Offside Line"
    color: "#EAC2CE"  # 粉白色
    linestyle: "--"
    trajectory:
      - [0.0, 82]
      - [2.0, 82]
      - [3.0, 92]
      - [4.0, 95]
