play_id: "T002"
title: "題型 2：肋部切割器"
description: "邊鋒（RW）在右路底線接球。邊鋒直塞給前腰（AM），前腰在禁區中央射正。"
scoring_mode: pass_points

evaluation_points:
  直塞: "傳球人：邊鋒（RW）→ 前腰（AM）；邊：直塞；接球點：禁區中央。"
  射正: "終點禁區中央射正。"

pass_points:
