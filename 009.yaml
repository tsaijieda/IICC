# 基本資訊與敘述
play_id: "T009"
title: "題型 9：誘敵深入與大逃亡 (修正反越位軌跡)"
description: "後腰在受壓下將球傳球給回撤的中後衛。中後衛接球後立刻執行回做球給另一側接應的邊後衛。邊後衛迎球不猶豫，直接發動強弱邊轉移至前場另一側完全空檔的邊鋒，完成突圍。"

# 評分檢核點
evaluation_points:
  傳球: "後腰由 Zone 8 向後傳至 Zone 5。"
  回做球: "中後衛背向敵方球門，一腳觸球敲給面向前方的邊後衛 (Zone 4 或 6)。"
  強弱邊轉移: "邊後衛起腳長傳，邊鋒反越位成功，球直接跨越半場飛至對角線的 Zone 17 或 19 且精準找到邊鋒。"

# 畫布與座標設定
y_label: "Field Depth (m)"
x_label: "Time (seconds)"
x_limits: [0.0, 8.5]
y_limits: [10, 100]

# 實體時空軌跡 (x-t data)
entities:
