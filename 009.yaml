play_id: "T009"
title: "題型 9：誘敵深入與大逃亡"
description: "後腰（DM）在後場中路接球。後腰傳球給中後衛（CB），中後衛在後場中路接球。中後衛回做球給邊後衛（FB），邊後衛在後場中路接球。邊後衛強弱邊轉移給邊鋒（W），邊鋒在左路底線接球。"
scoring_mode: pass_points

evaluation_points:
  傳球: "傳球人：後腰（DM）→ 中後衛（CB）；邊：傳球；接球點：後場中路。"
  回做球: "傳球人：中後衛（CB）→ 邊後衛（FB）；邊：回做球；接球點：後場中路。"
  強弱邊轉移: "傳球人：邊後衛（FB）→ 邊鋒（W）；邊：強弱邊轉移；接球點：左路底線。"

pass_points:
