  強弱邊轉移: "傳球人：前腰（AM）→ 右邊鋒（RW）；邊：強弱邊轉移；接球點：右邊路。"
  傳球: "傳球人：前腰（AM）→ 右邊鋒（RW）；邊：傳球；接球點：禁區中央；得分。"

