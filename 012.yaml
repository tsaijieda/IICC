play_id: "T012"
title: "題型 12：倒三角撕裂大巴"
description: "左邊鋒（LW）在左路底線接球。左邊鋒倒三角傳球給前腰（AM），前腰在弧頂前緣接球。前腰強弱邊轉移給右邊鋒（RW），右邊鋒在右邊路接球。前腰傳球給跑進禁區的右邊鋒（RW），右邊鋒在禁區中央得分。"
scoring_mode: pass_points

